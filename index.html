<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Spatial Iterated Prisoners Dilemma</title>
        <style>
            body {
                margin: 0;
                padding: 0;
                overflow: hidden;
                background-color: #eeeeee;
                width: 100vw;
                height: 100vh;
            }
            canvas {
                display: block;
                border: none;
                width: 100%;
                height: 100%;
            }
        </style>
    </head>
    <body>
        <canvas id="SIPDCanvas"></canvas>

        <script type="module">

            class Prisoner extends Agent{
              static payoff = {
                C: { C: 1, D: 0 },   // cooperator vs cooperator / vs defector
                D: { C: 1.9, D: 0 },   // defector   vs cooperator / vs defector
              };
               constructor(home,state){
                 super(home);
                 this.state = state;
                 this.score = 0;
               }

               trial(){
                 this.score = 0;
                 for(const n in this.home.neighbours){
                   nAgent = n.getOccupantNow();
                   this.score+= nAgent.payoff[this.state][nAgent.state];
                 }
               }
            }
            import CACanvas from "./ca-canvas.js";
            import Grid, { Agent } from "./cellular-automata.js";

            const canvasElement = document.getElementById("SIPDCanvas");
            const caCanvas = new CACanvas(canvasElement, 30);
            caCanvas.resizeAndReset();
            let gridInstance;

            function init() {
                gridInstance = new Grid(caCanvas.cols, caCanvas.rows);
                for (let y = 0; y < gridInstance.rows; y++) {
                    for (let x = 0; x < gridInstance.cols; x++) {
                        const cell = gridInstance.cells[y][x];
                        const newAgent = new Agent(cell);
                        cell.setOccupant(newAgent);
                        if (Math.random() < 0.5){
                          newAgent.setState("D");
                        }else{
                          newAgent.setState("C");
                        };
                    }
                }
            }

            function drawGrid() {
                caCanvas.clear();
                for (let y = 0; y < gridInstance.rows; y++) {
                    for (let x = 0; x < gridInstance.cols; x++) {
                        const cell = gridInstance.getCell(y, x);
                        const occupant = cell.getOccupant();
                        let colour = "";
                        if (occupant.state == "D") {
                            colour = "blue";
                        }
                        if (occupant.state == "C") {
                            colour = "red";
                        }
                        caCanvas.drawSquareAt(x, y, colour, true);
                    }
                }
            }
            init();
            drawGrid();
        </script>
    </body>
</html>
