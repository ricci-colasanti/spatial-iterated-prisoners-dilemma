<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Spatial Iterated Prisoners Dilemma</title>
        <style>
            body {
                margin: 0;
                padding: 0;
                overflow: hidden;
                background-color: #eeeeee;
                width: 100vw;
                height: 100vh;
            }
            canvas {
                display: block;
                border: none;
                width: 100%;
                height: 100%;
            }
        </style>
    </head>
    <body>
        <canvas id="SIPDCanvas"></canvas>

        <script type="module">
            class Prisoner extends Agent {
                static payoff = {
                    C: { C: 1, D: 0 },
                    D: { C: 1.6, D: 0 },
                };
                static now = 0;
                static next = 1;


                static update() {
                  [Prisoner.now, Prisoner.next] = [Prisoner.next, Prisoner.now];
                }

                constructor(home, state) {
                    super(home);
                    this.state = [state, ""];
                    this.score = 0;
                }

                trial() {
                    this.score = 0;
                    for (let i=0; i<this.home.neighbours.length;i++) {
                        let nAgent = this.home.neighbours[i].getOccupant();
                        this.score += Prisoner.payoff[this.getState()][nAgent.getState()];
                    }
                }

                change() {
                    let choice = this;
                    for (let i=0; i<this.home.neighbours.length;i++) {
                        let nAgent = this.home.neighbours[i].getOccupant();
                        if (choice.score < nAgent.score) {
                            choice = nAgent;
                        }
                    }
                    this.setState(choice.getState());
                }

                getState() {
                    return this.state[Prisoner.now];
                }

                setState(state) {
                    this.state[Prisoner.next] = state;
                }
            }

            import CACanvas from "./ca-canvas.js";
            import Grid, { Agent } from "./cellular-automata.js";

            const canvasElement = document.getElementById("SIPDCanvas");
            const caCanvas = new CACanvas(canvasElement, 60);
            caCanvas.resizeAndReset();
            let gridInstance;
            let running = false;
            let speed = 100;


            function iterate() {

                if (!gridInstance) return;
                for (let y = 0; y < gridInstance.rows; y++) {
                    for (let x = 0; x < gridInstance.cols; x++) {
                        const cell = gridInstance.cells[y][x];
                        const agent = cell.getOccupant();
                        agent.trial();
                    }
                }
                for (let y = 0; y < gridInstance.rows; y++) {
                    for (let x = 0; x < gridInstance.cols; x++) {
                        const cell = gridInstance.cells[y][x];
                        const agent = cell.getOccupant();
                        agent.change();
                    }
                }
                Prisoner.update();
                drawGrid();
            }

            function timeLoop() {
                if (running) {
                    iterate();
                }
                setTimeout(timeLoop, speed);
            }

            function init() {
                gridInstance = new Grid(caCanvas.cols, caCanvas.rows);
                for (let y = 0; y < gridInstance.rows; y++) {
                    for (let x = 0; x < gridInstance.cols; x++) {
                        const cell = gridInstance.cells[y][x];
                        const newAgent = new Prisoner(cell);
                        cell.setOccupant(newAgent);
                        if (Math.random() < 0.5) {
                            newAgent.setState("D");
                        } else {
                            newAgent.setState("C");
                        }
                    }
                }
                Prisoner.update();
                drawGrid();
                running = true;
                timeLoop();
            }

            function drawGrid() {
                caCanvas.clear();
                for (let y = 0; y < gridInstance.rows; y++) {
                    for (let x = 0; x < gridInstance.cols; x++) {
                        const cell = gridInstance.getCell(y, x);
                        const occupant = cell.getOccupant();
                        let colour = "";
                        if (occupant.getState() == "D") {
                            colour = "blue";
                        }
                        if (occupant.getState() == "C") {
                            colour = "red";
                        }
                        caCanvas.drawSquareAt(x, y, colour, true);
                    }
                }
            }
            init();
        </script>
    </body>
</html>
