<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Spatial Iterated Prisoners Dilemma</title>
        <style>
            body {
                margin: 0;
                padding: 0;
                overflow: hidden;
                background-color: #eeeeee;
                width: 100vw;
                height: 100vh;
            }
            canvas {
                display: block;
                border: none;
                width: 100%;
                height: 100%;
            }
        </style>
    </head>
    <body>
        <canvas id="SIPDCanvas"></canvas>

        <script type="module">
            /**
             * Prisoner Class - Implements agents playing the Iterated Symmetric Prisoner's Dilemma
             *
             * This simulation models how cooperation (C) and defection (D) strategies spread
             * through a population based on payoffs from neighbor interactions.
             *
             * Payoff Matrix:
             *   - Mutual Cooperation (C vs C): Both get 1 point
             *   - Defector vs Cooperator: Defector gets 1.6, Cooperator gets 0
             *   - Mutual Defection (D vs D): Both get 0 points
             */
            class Prisoner extends Agent {
                // Static payoff matrix defining points earned for each strategy combination
                // Format: payoff[my_strategy][opponent_strategy] = points
                static payoff = {
                    C: { C: 1, D: 0 }, // Cooperating: get 1 vs cooperator, 0 vs defector
                    D: { C: 1.6, D: 0 }, // Defecting: get 1.6 vs cooperator, 0 vs defector
                };

                // Double-buffering system for state management (prevents race conditions during updates)
                static now = 0; // Index pointing to current active state
                static next = 1; // Index pointing to buffer for next state

                /**
                 * Swaps the now/next buffers to finalize the update cycle
                 * Called once per iteration after all agents have computed their next state
                 */
                static update() {
                    [Prisoner.now, Prisoner.next] = [
                        Prisoner.next,
                        Prisoner.now,
                    ];
                }

                /**
                 * @param {Cell} home - The grid cell this agent occupies
                 * @param {string} state - Initial strategy ('C' for cooperate, 'D' for defect)
                 */
                constructor(home, state) {
                    super(home);
                    // Double-buffered state array: [currentState, nextState]
                    this.state = [state, ""];
                    this.score = 0; // Current iteration's accumulated score
                    this.changed = false; // Flag indicating if agent copied a neighbor's strategy
                }

                /**
                 * Plays the Prisoner's Dilemma game against all neighboring cells
                 * Accumulates score based on payoff matrix and neighbor strategies
                 * Note: Scores are summed across all neighbors (not averaged)
                 */
                trial() {
                    this.score = 0;
                    for (let i = 0; i < this.home.neighbours.length; i++) {
                        let nAgent = this.home.neighbours[i].getOccupant();
                        this.score +=
                            Prisoner.payoff[this.getState()][nAgent.getState()];
                    }
                }

                /**
                 * Strategy update rule: compare scores with neighbors and adopt the highest-scoring strategy
                 * If any neighbor has a higher score, this agent copies their strategy
                 * Implements "imitation of the successful" evolutionary dynamics
                 */
                change() {
                    let choice = this; // Default to keeping own strategy
                    this.changed = false;

                    // Find neighbor with highest score
                    for (let i = 0; i < this.home.neighbours.length; i++) {
                        let nAgent = this.home.neighbours[i].getOccupant();
                        if (choice.score < nAgent.score) {
                            choice = nAgent;
                            this.changed = true;
                        }
                    }
                    // Adopt the winning neighbor's strategy (or keep own if tied/no better neighbor)
                    this.setState(choice.getState());
                }

                /**
                 * Gets the current active state using double-buffering
                 * @returns {string} - Current strategy ('C' or 'D')
                 */
                getState() {
                    return this.state[Prisoner.now];
                }

                /**
                 * Sets the next state in the buffer (doesn't take effect until update())
                 * @param {string} state - New strategy to adopt for next iteration
                 */
                setState(state) {
                    this.state[Prisoner.next] = state;
                }
            }

            // Import dependencies for canvas rendering and grid infrastructure
            import CACanvas from "./ca-canvas.js";
            import Grid, { Agent } from "./cellular-automata.js";

            // Handle browser resize events
            window.addEventListener("resize", handleResize);

            // Get canvas DOM element and initialize custom canvas controller
            const canvasElement = document.getElementById("SIPDCanvas");
            const caCanvas = new CACanvas(canvasElement, 60);

            // Initialize canvas dimensions
            caCanvas.resizeAndReset();

            let gridInstance; // Reference to the cellular automata grid
            let running = false; // Simulation control flag
            let speed = 100; // Milliseconds between iterations (lower = faster)
            let loopStarted = false; // Prevent multiple animation loops from starting

            /**
             * Main iteration function - advances the simulation by one timestep
             * Executes in three phases:
             * 1. All agents play games and calculate scores
             * 2. All agents update strategies based on neighbor comparison
             * 3. Swap state buffers and redraw
             */
            function iterate() {
                if (!gridInstance) return;

                // Phase 1: Calculate scores for all agents
                for (let y = 0; y < gridInstance.rows; y++) {
                    for (let x = 0; x < gridInstance.cols; x++) {
                        const cell = gridInstance.cells[y][x];
                        const agent = cell.getOccupant();
                        agent.trial();
                    }
                }

                // Phase 2: Update strategies for all agents
                for (let y = 0; y < gridInstance.rows; y++) {
                    for (let x = 0; x < gridInstance.cols; x++) {
                        const cell = gridInstance.cells[y][x];
                        const agent = cell.getOccupant();
                        agent.change();
                    }
                }

                // Phase 3: Finalize state transition and render
                Prisoner.update();
                drawGrid();
            }

            /**
             * Animation loop using setTimeout for controllable speed
             * Continues indefinitely while running flag is true
             */
            function timeLoop() {
                if (running) {
                    iterate();
                }
                setTimeout(timeLoop, speed);
            }

            /**
             * Initializes the simulation grid with randomly assigned strategies
             * Approximately 30% start as defectors, 70% as cooperators
             */
            function init() {
                gridInstance = new Grid(caCanvas.cols, caCanvas.rows);

                // Create agent in each cell with randomized initial strategy
                for (let y = 0; y < gridInstance.rows; y++) {
                    for (let x = 0; x < gridInstance.cols; x++) {
                        const cell = gridInstance.cells[y][x];
                        const newAgent = new Prisoner(cell);
                        cell.setOccupant(newAgent);

                        // 30% chance of defection, 70% cooperation initially
                        if (Math.random() < 0.3) {
                            newAgent.setState("D");
                        } else {
                            newAgent.setState("C");
                        }
                    }
                }

                Prisoner.update();
                drawGrid();
                running = true;

                // Start animation loop only once
                if (!loopStarted) {
                    loopStarted = true;
                    timeLoop();
                }
            }

            /**
             * Renders the current grid state to the canvas
             * Color coding:
             *   - Red (#ff0000): Cooperators who kept their strategy
             *   - Light Red (#ff9999): Cooperators who just changed to cooperation
             *   - Blue (#0000ff): Defectors who kept their strategy
             *   - Light Blue (#9999ff): Defectors who just changed to defection
             */
            function drawGrid() {
                caCanvas.clear();
                for (let y = 0; y < gridInstance.rows; y++) {
                    for (let x = 0; x < gridInstance.cols; x++) {
                        const cell = gridInstance.getCell(y, x);
                        const occupant = cell.getOccupant();
                        let colour = "";

                        // Defector colors (blue tones)
                        if (occupant.getState() == "D") {
                            if (occupant.changed) {
                                colour = "#9999ff"; // Changed to defection
                            } else {
                                colour = "#0000ff"; // Stable defector
                            }
                        }

                        // Cooperator colors (red tones)
                        if (occupant.getState() == "C") {
                            if (occupant.changed) {
                                colour = "#ff9999"; // Changed to cooperation
                            } else {
                                colour = "#ff0000"; // Stable cooperator
                            }
                        }

                        caCanvas.drawSquareAt(x, y, colour, true);
                    }
                }
            }

            // Start the simulation
            init();

            /**
             * Resize handler - recreates grid when browser window changes size
             * Warning: This resets the entire simulation with new random initialization
             */
            function handleResize() {
                caCanvas.resizeAndReset();
                init();
            }
        </script>
    </body>
</html>
